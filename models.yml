  - id: qwen3-vl-embedding-8b
    enabled: false
    kind: embedding
    backend: vllm
    image: vllm-node
    pull_policy: never
    hf_model: RamManavalan/Qwen3-VL-Embedding-8B-FP8
    served_names:
      - qwen3-vl-embedding-8b

    gpu:
      device_ids: ["0"]
      memory_fraction: 0.25

    vllm:
      runner: pooling
      max_model_len: 8192
      max_num_seqs: 16
      trust_remote_code: true
      extra_args:
        - "--limit-mm-per-prompt"
        - '{"image":1}'

    routing:
      internal_port: 8000
      host_port: 8104
      expose_host: false
      expose_publicly: false

    litellm:
      mode: embedding
      input_cost_per_token: 0
      # LiteLLM's OpenAI embedding path forwards omitted encoding_format as null;
      # vLLM accepts omission but rejects null, so set a proxy-side default.
      params:
        encoding_format: float


  - id: qwen3-6-35b-a3b-nvfp4
    enabled: false
    kind: chat
    backend: vllm
    image: vllm-node
    pull_policy: never
    hf_model: nvidia/Qwen3.6-35B-A3B-NVFP4
    served_names:
