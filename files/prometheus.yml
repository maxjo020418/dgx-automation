global:
  scrape_interval: 1s
  evaluation_interval: 1s
  scrape_timeout: 900ms

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8089

  - job_name: gpu
    static_configs:
      - targets:
          - gpu-exporter:9400

  - job_name: vllm
    metrics_path: /metrics
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/vllm.yml
