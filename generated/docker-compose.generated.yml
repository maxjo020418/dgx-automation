# DO NOT EDIT: generated by scripts/render.py from stack.yml and models.yml
name: dgxllm

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dgx-litellm
    restart: unless-stopped
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:4000/v1/models", timeout=3).read()'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      dgx-llm-net:
        aliases:
          - litellm

networks:
  dgx-llm-net:
    name: dgx-llm-net
    external: true
