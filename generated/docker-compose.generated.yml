# DO NOT EDIT: generated by scripts/render.py from stack.yml and models.yml
name: dgxllm

services:
  traefik:
    image: traefik:v3.6
    container_name: dgx-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--entrypoints.web.address=:80"
    ports:
      - "192.168.111.1:80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      dgx-llm-net:
        aliases:
          - api.spark.cg-rookies.net

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: dgx-litellm
    restart: unless-stopped
    command:
      - "--config"
      - "/app/config.yaml"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "4000"
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    ports:
      - "192.168.111.1:4000:4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`api.spark.cg-rookies.net`)"
      - "traefik.http.routers.litellm.entrypoints=web"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    depends_on:
      - vllm-gemma-4-26b
    networks:
      - dgx-llm-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - ${DGX_ENV_FILE:-.env}
    environment:
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: "http://litellm:4000/v1"
      OPENAI_API_BASE_URLS: "http://litellm:4000/v1"
      OPENAI_API_KEY: "not-needed"
      OPENAI_API_KEYS: "not-needed"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      DEFAULT_MODELS: "gemma-4-26b"
    volumes:
      - open-webui-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "spark.cg-rookies.net:192.168.111.1"
      - "chat.spark.cg-rookies.net:192.168.111.1"
      - "grafana.spark.cg-rookies.net:192.168.111.1"
      - "search.spark.cg-rookies.net:192.168.111.1"
    ports:
      - "192.168.111.1:3000:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.spark.cg-rookies.net`) || Host(`spark.cg-rookies.net`)"
      - "traefik.http.routers.openwebui.entrypoints=web"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"
    depends_on:
      - litellm
    networks:
      - dgx-llm-net

  vllm-gemma-4-26b:
    image: vllm-node
    pull_policy: never
    container_name: vllm-gemma-4-26b
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "64g"
    ulimits:
      memlock: -1
      stack: 67108864
    env_file:
      - ${DGX_ENV_FILE:-.env}
    environment:
      HF_TOKEN: "${HF_TOKEN:-}"
      HF_HOME: /root/.cache/huggingface
      NCCL_IGNORE_CPU_AFFINITY: "1"
    command:
      - vllm
      - serve
      - nvidia/Gemma-4-26B-A4B-NVFP4
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --gpu-memory-utilization
      - '0.71'
      - --served-model-name
      - gemma-4-26b
      - --max-model-len
      - '262144'
      - --max-num-seqs
      - '32'
      - --max-num-batched-tokens
      - '32768'
      - --kv-cache-dtype
      - fp8
      - --quantization
      - modelopt
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - /workspace/vllm/chat-templates/tool_chat_template_gemma4.jinja
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --enable-prefix-caching
    volumes:
      - "/home/ymin/.cache/huggingface:/root/.cache/huggingface"
      - "/home/ymin/.cache/vllm:/root/.cache/vllm"
      - "/home/ymin/.cache/flashinfer:/root/.cache/flashinfer"
      - "/home/ymin/.triton:/root/.triton"
      - ./chat-templates:/workspace/vllm/chat-templates:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: ["gpu"]
    networks:
      - dgx-llm-net

  prometheus:
    image: prom/prometheus:latest
    container_name: dgx-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-vllm-targets.yml:/etc/prometheus/targets/vllm.yml:ro
    networks:
      - dgx-llm-net

  grafana:
    image: grafana/grafana-oss:latest
    container_name: dgx-grafana
    restart: unless-stopped
    env_file:
      - ${DGX_ENV_FILE:-.env}
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_DEFAULT_THEME: system
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: "1s"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "192.168.111.1:3300:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.spark.cg-rookies.net`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - prometheus
    networks:
      - dgx-llm-net

  node-exporter:
    image: prom/node-exporter:latest
    container_name: dgx-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - "--web.listen-address=:9100"
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/host"
      - "--collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)"
      - "--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|mqueue|nsfs|overlay|proc|pstore|rpc_pipefs|securityfs|sysfs|tracefs)$"
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - dgx-llm-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: dgx-cadvisor
    restart: unless-stopped
    privileged: true
    healthcheck:
      disable: true
    command:
      - "--port=8089"
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - dgx-llm-net

  gpu-exporter:
    build:
      context: ./gpu-exporter
    image: dgx-gpu-exporter:local
    container_name: dgx-gpu-exporter
    restart: unless-stopped
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      GPU_EXPORTER_LISTEN_ADDR: 0.0.0.0
      GPU_EXPORTER_PORT: 9400
    volumes:
      - /usr/bin/nvidia-smi:/usr/bin/nvidia-smi:ro
    networks:
      - dgx-llm-net

  browserless:
    image: ghcr.io/browserless/chromium:latest
    container_name: browserless
    restart: unless-stopped
    ports:
      - "192.168.111.1:3003:3000"
    networks:
      - dgx-llm-net

  searxng:
    image: searxng/searxng:latest
    container_name: searxng-core
    restart: unless-stopped
    env_file:
      - ${DGX_ENV_FILE:-.env}
    environment:
      SEARXNG_BASE_URL: "http://search.spark.cg-rookies.net/"
      SEARXNG_SECRET_KEY: "${SEARXNG_SECRET_KEY}"
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-core-data:/var/cache/searxng
    ports:
      - "192.168.111.1:8888:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.searxng.rule=Host(`search.spark.cg-rookies.net`)"
      - "traefik.http.routers.searxng.entrypoints=web"
      - "traefik.http.services.searxng.loadbalancer.server.port=8080"
    depends_on:
      - searxng-valkey
    networks:
      - dgx-llm-net

  searxng-valkey:
    image: valkey/valkey:9-alpine
    container_name: searxng-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "30", "1", "--loglevel", "warning"]
    volumes:
      - searxng-valkey-data:/data
    networks:
      - dgx-llm-net

networks:
  dgx-llm-net:
    name: dgx-llm-net

volumes:
  open-webui-data:
    name: open-webui
  prometheus-data:
    name: spark-system-dashboard_prometheus-data
  grafana-data:
    name: spark-system-dashboard_grafana-data
  searxng-core-data:
    name: searxng_core-data
  searxng-valkey-data:
    name: searxng_valkey-data
