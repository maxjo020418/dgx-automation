- name: Check legacy DGX containers
  hosts: dgx
  become: true
  tasks:
    - name: List running containers
      ansible.builtin.command:
        cmd: docker ps --format '{% raw %}{{.Names}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}{% endraw %}'
      register: docker_ps
      changed_when: false

    - name: Show running containers
      ansible.builtin.debug:
        msg: "{{ docker_ps.stdout_lines }}"

    - name: Show UFW status
      ansible.builtin.command:
        cmd: ufw status verbose
      register: ufw_status
      changed_when: false
      failed_when: false

    - name: Print UFW status
      ansible.builtin.debug:
        msg: "{{ ufw_status.stdout_lines }}"
