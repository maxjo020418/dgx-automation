- name: Apply DGX vLLM/LiteLLM stack
  hosts: dgx
  become: true
  vars_files:
    - ../stack.yml
    - ../generated/vllm-launch.generated.yml
  vars:
    pull_images: true
    compose_up: true
    release_id: "{{ ansible_date_time.iso8601_basic_short }}"
    release_retention_keep: "{{ deployment.release_retention.keep | default(5) | int }}"

  tasks:
    - name: Ensure deploy directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ deploy_dir }}"
        - "{{ deploy_dir }}/releases"
        - "{{ deploy_dir }}/vllm-launch"

    - name: Install initial environment file when missing
      ansible.builtin.copy:
        src: ../.env.example
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"
        force: false

    - name: Ensure runtime secrets exist
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import re
        import secrets
        from pathlib import Path

        env_path = Path("{{ deploy_dir }}/.env")
        existing_hf_token_path = Path("{{ secrets.existing_hf_token_file }}")
        env = {}
        order = []
        if env_path.exists():
            for raw in env_path.read_text().splitlines():
                if "=" in raw and not raw.lstrip().startswith("#"):
                    key, value = raw.split("=", 1)
                    env[key] = value
                    order.append(key)

        def set_default(key, value, replace_values=("", "change-me-before-use")):
            if env.get(key, "") in replace_values:
                env[key] = value
                if key not in order:
                    order.append(key)

        if {{ 'True' if services.litellm.auth_enabled | default(true) | bool else 'False' }}:
            set_default("LITELLM_MASTER_KEY", "sk-" + secrets.token_hex(32))
        else:
            env.pop("LITELLM_MASTER_KEY", None)
            order = [key for key in order if key != "LITELLM_MASTER_KEY"]
        set_default("GRAFANA_ADMIN_PASSWORD", secrets.token_urlsafe(24))
        set_default("SEARXNG_SECRET_KEY", secrets.token_urlsafe(32))
        if not env.get("GRAFANA_ADMIN_USER"):
            env["GRAFANA_ADMIN_USER"] = "admin"
            order.append("GRAFANA_ADMIN_USER")

        if not env.get("HF_TOKEN") and existing_hf_token_path.exists():
            for line in existing_hf_token_path.read_text().splitlines():
                match = re.match(r"^(?:export\s+)?HF_TOKEN=(.*)$", line.strip())
                if match:
                    token = match.group(1).strip().strip('"').strip("'")
                    if token:
                        env["HF_TOKEN"] = token
                        if "HF_TOKEN" not in order:
                            order.append("HF_TOKEN")

        seen = set()
        lines = []
        for key in order:
            if key in env and key not in seen:
                lines.append(f"{key}={env[key]}")
                seen.add(key)
        for key in sorted(set(env) - seen):
            lines.append(f"{key}={env[key]}")
        env_path.write_text("\n".join(lines) + "\n")
        env_path.chmod(0o600)
        PY
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
      when: not ansible_check_mode

    - name: Ensure shared Docker network exists
      ansible.builtin.shell: |
        set -euo pipefail
        if docker network inspect "{{ network.name }}" >/dev/null 2>&1; then
          echo exists
        else
          docker network create "{{ network.name }}"
          echo created
        fi
      args:
        executable: /bin/bash
      register: shared_network
      changed_when: "'created' in shared_network.stdout"
      when: not ansible_check_mode

    - name: Create release archive directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}/releases/{{ release_id }}"
        state: directory
        mode: "0755"

    - name: Archive previous runtime files when present
      ansible.builtin.shell: |
        set -euo pipefail
        for path in compose.yml litellm.config.yaml prometheus-vllm-targets.yml vllm-launch .env; do
          if [ -e "{{ deploy_dir }}/${path}" ]; then
            cp -a "{{ deploy_dir }}/${path}" "{{ deploy_dir }}/releases/{{ release_id }}/${path}"
          fi
        done
      args:
        executable: /bin/bash
      changed_when: false
      when: not ansible_check_mode

    - name: Prune old release archives
      ansible.builtin.shell: |
        set -euo pipefail
        python3 - <<'PY'
        import shutil
        from pathlib import Path

        keep = max(1, int("{{ release_retention_keep }}"))
        releases = Path("{{ deploy_dir }}/releases")
        entries = [path for path in releases.iterdir() if path.name not in (".", "..")]
        entries.sort(key=lambda path: (path.stat().st_mtime, path.name), reverse=True)
        stale = entries[keep:]
        for path in stale:
            if path.is_dir() and not path.is_symlink():
                shutil.rmtree(path)
            else:
                path.unlink()
        print(f"deleted={len(stale)} kept={min(len(entries), keep)}")
        PY
      args:
        executable: /bin/bash
      register: prune_release_archives
      changed_when: "'deleted=0' not in prune_release_archives.stdout"
      when:
        - release_retention_keep | int > 0
        - not ansible_check_mode

    - name: Copy generated compose
      ansible.builtin.copy:
        src: ../generated/docker-compose.generated.yml
        dest: "{{ deploy_dir }}/compose.yml"
        mode: "0644"

    - name: Copy generated LiteLLM config
      ansible.builtin.copy:
        src: ../generated/litellm.config.yaml
        dest: "{{ deploy_dir }}/litellm.config.yaml"
        mode: "0640"
      register: litellm_config_copy

    - name: Copy generated Prometheus vLLM targets
      ansible.builtin.copy:
        src: ../generated/prometheus-vllm-targets.yml
        dest: "{{ deploy_dir }}/prometheus-vllm-targets.yml"
        mode: "0644"

    - name: Copy generated vLLM launch scripts
      ansible.builtin.copy:
        src: ../generated/vllm-launch/
        dest: "{{ deploy_dir }}/vllm-launch/"
        mode: "0755"
      when: vllm_launch_models | default([]) | length > 0

    - name: Remove retired model-stack support files
      ansible.builtin.file:
        path: "{{ deploy_dir }}/{{ item }}"
        state: absent
      loop:
        - chat-templates
        - grafana
        - searxng
        - gpu-exporter
        - prometheus.yml
        - traefik-dynamic.yml
      when: not ansible_check_mode

    - name: Check Docker Compose config
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml config
        chdir: "{{ deploy_dir }}"
      changed_when: false
      when: not ansible_check_mode

    - name: Pull remote images
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml pull --ignore-buildable --ignore-pull-failures
        chdir: "{{ deploy_dir }}"
      register: pull_result
      failed_when: false
      changed_when: pull_result.rc == 0
      when:
        - pull_images | bool
        - not ansible_check_mode

    - name: Discover Compose services
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml config --services
        chdir: "{{ deploy_dir }}"
      register: compose_services
      changed_when: false
      when:
        - compose_up | bool
        - not ansible_check_mode

    - name: Group Compose services
      ansible.builtin.set_fact:
        vllm_compose_services: "{{ compose_services.stdout_lines | select('match', '^vllm-') | list }}"
        non_vllm_compose_services: "{{ compose_services.stdout_lines | reject('match', '^vllm-') | list }}"
      when:
        - compose_up | bool
        - not ansible_check_mode

    - name: Check NVIDIA persistenced socket
      ansible.builtin.stat:
        path: /run/nvidia-persistenced/socket
      register: nvidia_persistenced_socket
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not ansible_check_mode

    - name: Check nvidia-persistenced systemd unit
      ansible.builtin.command:
        cmd: systemctl list-unit-files nvidia-persistenced.service --no-legend
      register: nvidia_persistenced_unit
      changed_when: false
      failed_when: false
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not (nvidia_persistenced_socket.stat.exists | default(false))
        - not ansible_check_mode

    - name: Start nvidia-persistenced for GPU containers
      ansible.builtin.systemd:
        name: nvidia-persistenced
        state: started
        enabled: true
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not (nvidia_persistenced_socket.stat.exists | default(false))
        - (nvidia_persistenced_unit.stdout | default('')) | length > 0
        - not ansible_check_mode

    - name: Wait for NVIDIA persistenced socket
      ansible.builtin.wait_for:
        path: /run/nvidia-persistenced/socket
        state: present
        timeout: 10
      register: nvidia_persistenced_socket_wait
      failed_when: false
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not (nvidia_persistenced_socket.stat.exists | default(false))
        - (nvidia_persistenced_unit.stdout | default('')) | length > 0
        - not ansible_check_mode

    - name: Recheck NVIDIA persistenced socket
      ansible.builtin.stat:
        path: /run/nvidia-persistenced/socket
      register: nvidia_persistenced_socket_after
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not ansible_check_mode

    - name: Fail when NVIDIA persistenced socket is missing
      ansible.builtin.fail:
        msg: >-
          NVIDIA Container Toolkit expects /run/nvidia-persistenced/socket for
          GPU containers, but the socket is missing. Start or reinstall
          nvidia-persistenced on the host, then rerun make apply. On a systemd
          host this is usually: sudo systemctl enable --now nvidia-persistenced
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not (nvidia_persistenced_socket_after.stat.exists | default(false))
        - not ansible_check_mode

    - name: Apply vLLM models with Spark launcher
      ansible.builtin.shell: |
        set -euo pipefail
        timeout={{ deployment.vllm.startup_timeout_seconds | default(1800) | int }}
        poll={{ deployment.vllm.startup_poll_seconds | default(5) | int }}
        settle={{ deployment.vllm.startup_settle_seconds | default(0) | int }}
        container={{ item.container_name | quote }}
        launch_script={{ (deploy_dir ~ '/' ~ item.launch_script) | quote }}

        if docker inspect "$container" >/dev/null 2>&1; then
          docker rm -f "$container" >/dev/null
        fi

        export HOME={{ deployment.vllm.launcher_home | default('/home/ymin') | quote }}
        export HF_HOME={{ paths.hf_cache | quote }}
        export VLLM_SPARK_EXTRA_DOCKER_ARGS={{ item.extra_docker_args | quote }}

        launcher_args=(
          --solo
          -d
          -t {{ item.image | quote }}
          --name "$container"
          -p {{ item.port_mapping | quote }}
        )
        if [ "{{ deployment.vllm.earlyoom | default(true) | bool }}" = "True" ]; then
          launcher_args+=(--earlyoom)
        fi
        {% for mod in item.apply_mods | default([]) %}
        launcher_args+=(--apply-mod {{ mod | quote }})
        {% endfor %}
        launcher_args+=(--launch-script "$launch_script")

        ./launch-cluster.sh "${launcher_args[@]}"

        cid="$(docker inspect -f '{% raw %}{{.Id}}{% endraw %}' "$container")"
        deadline=$((SECONDS + timeout))
        while true; do
          running="$(docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' "$cid")"
          if docker exec "$cid" python3 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:{{ item.internal_port }}/health", timeout=2).read()' >/dev/null 2>&1; then
            echo "$container is healthy"
            break
          fi
          if [ "$running" != "true" ]; then
            echo "$container exited before becoming healthy" >&2
            docker logs --tail 100 "$cid" >&2 || true
            exit 1
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            echo "$container did not become healthy within ${timeout}s" >&2
            docker logs --tail 100 "$cid" >&2 || true
            exit 1
          fi
          sleep "$poll"
        done

        if [ "$settle" -gt 0 ]; then
          sleep "$settle"
        fi
      args:
        executable: /bin/bash
        chdir: "{{ deployment.vllm.launcher_dir | default('/home/ymin/spark-vllm-docker') }}"
      loop: "{{ vllm_launch_models | default([]) }}"
      loop_control:
        label: "{{ item.container_name }}"
      when:
        - compose_up | bool
        - vllm_launch_models | default([]) | length > 0
        - not ansible_check_mode

    - name: Apply LiteLLM service
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml up -d --build --remove-orphans {{ non_vllm_compose_services | join(' ') }}
        chdir: "{{ deploy_dir }}"
      when:
        - compose_up | bool
        - deployment.vllm.staggered_start | default(true) | bool
        - non_vllm_compose_services | default([]) | length > 0
        - not ansible_check_mode

    - name: Apply Compose stack
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml up -d --build --remove-orphans
        chdir: "{{ deploy_dir }}"
      when:
        - compose_up | bool
        - not (deployment.vllm.staggered_start | default(true) | bool)
        - not ansible_check_mode

    - name: Check LiteLLM mounted config
      ansible.builtin.shell: |
        set -euo pipefail
        cid="$(docker compose -p {{ project_name }} -f compose.yml ps -q litellm || true)"
        if [ -z "$cid" ]; then
          echo "missing"
          exit 0
        fi
        host_sha="$(sha256sum litellm.config.yaml | awk '{print $1}')"
        container_sha="$(docker exec "$cid" sha256sum /app/config.yaml 2>/dev/null | awk '{print $1}' || true)"
        if [ "$host_sha" = "$container_sha" ]; then
          echo "match"
          exit 0
        fi
        echo "mismatch host=${host_sha} container=${container_sha:-missing}"
        exit 1
      args:
        executable: /bin/bash
        chdir: "{{ deploy_dir }}"
      register: litellm_config_mount_check
      changed_when: false
      failed_when: false
      when:
        - services.litellm.enabled | bool
        - compose_up | bool
        - not ansible_check_mode

    - name: Recreate LiteLLM after config drift
      ansible.builtin.command:
        cmd: docker compose -p {{ project_name }} -f compose.yml up -d --force-recreate --no-deps litellm
        chdir: "{{ deploy_dir }}"
      when:
        - services.litellm.enabled | bool
        - compose_up | bool
        - (litellm_config_copy.changed | default(false)) or ((litellm_config_mount_check.rc | default(0)) != 0)
        - not ansible_check_mode

    - name: Wait for LiteLLM HTTP surface
      ansible.builtin.uri:
        url: "http://{{ network.bind_ip }}:{{ services.litellm.host_port }}/v1/models"
        method: GET
        status_code: [200, 401, 403]
      register: litellm_health
      retries: 30
      delay: 5
      until: litellm_health.status in [200, 401, 403]
      when:
        - services.litellm.enabled | bool
        - services.litellm.expose_host | bool
        - compose_up | bool
        - not ansible_check_mode
