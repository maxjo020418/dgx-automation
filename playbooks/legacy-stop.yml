- name: Stop legacy DGX containers
  hosts: dgx
  become: true
  vars_files:
    - ../stack.yml
  tasks:
    - name: Remove legacy containers while preserving named volumes
      ansible.builtin.command:
        cmd: docker rm -f {{ item }}
      loop: "{{ legacy.containers }}"
      register: legacy_stop
      failed_when: false
      changed_when: legacy_stop.rc == 0
